<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Semáforo Sensorial</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 1em;
        }
        button {
            background-color: #f0e68c;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .msg {
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h2>Redefinir Senha</h2>
    <p>Digite sua nova senha abaixo:</p>

    <input type="password" id="newPassword" placeholder="Nova senha">
    <button onclick="resetPassword()">Redefinir Senha</button>

    <div class="msg" id="msg"></div>

    <script>
        // Pega o token da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const msg = document.getElementById('msg');

            if (!newPassword) {
                msg.textContent = "Digite uma nova senha.";
                msg.style.color = "red";
                return;
            }

            try {
                const res = await fetch('/usuarios/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    msg.textContent = data.mensagem || "Senha redefinida com sucesso!";
                    msg.style.color = "green";
                } else {
                    msg.textContent = data.mensagem || "Erro ao redefinir senha.";
                    msg.style.color = "red";
                }
            } catch (err) {
                msg.textContent = "Erro de rede ou servidor.";
                msg.style.color = "red";
                console.error(err);
            }
        }
    </script>
</body>
</html>
